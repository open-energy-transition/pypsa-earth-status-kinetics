# Settings for the Japan prefecture generation validation (PyPSA vs METI).
# Used by:
#   scripts/build_reference_generation_meti_prefecture.py
#   scripts/build_network_prefecture_generation.py
#   scripts/compare_prefecture_generation.py

# Categories compared (METI categories), in plotting order
categories: [thermal, nuclear, hydro, solar, wind, geothermal, biomass, waste]

# Buses that carry electricity. Only generators and storage units on these
# buses are counted (in sector-coupled networks, generators on fuel buses are
# fuel supply and solar thermal sits on heat buses).
electricity_bus_carriers: [AC, DC, low voltage]

# Carriers that are not electricity generation
not_generation:
- load shedding
- H2 fuel cell   # electricity from stored hydrogen, like a battery
- H2 Fuel Cell   # same carrier, different spelling in sector-coupled networks

# PyPSA carrier -> METI category
carrier_mapping:
  CCGT: thermal
  OCGT: thermal
  coal: thermal
  lignite: thermal
  oil: thermal
  nuclear: nuclear
  hydro: hydro
  ror: hydro
  PHS: hydro          # METI hydro includes pumped storage
  onwind: wind
  offwind-ac: wind
  offwind-dc: wind
  solar: solar
  geothermal: geothermal
  biomass EOP: biomass  # sector-coupled networks: biomass power plant as link
  # waste: not yet represented in the solved networks

# METI Excel (sheet "<year>_Annual") column -> category
# METI "thermal power plant" includes biomass and waste; they are subtracted
# from thermal and compared as their own categories.
meti_columns:
  hydroelectric power plant: hydro
  thermal power plant: thermal
  nuclear power plant: nuclear
  wind power: wind
  sunlight: solar
  geothermal: geothermal
  biomass: biomass
  Waste: waste

# Prefecture -> region (8 standard regions of Japan)
regions:
  Hokkaido: [Hokkaido]
  Tohoku: [Aomori, Iwate, Miyagi, Akita, Yamagata, Fukushima]
  Kanto: [Ibaraki, Tochigi, Gunma, Saitama, Chiba, Tokyo, Kanagawa]
  Chubu: [Niigata, Toyama, Ishikawa, Fukui, Yamanashi, Nagano, Gifu, Shizuoka, Aichi]
  Kansai: [Mie, Shiga, Kyoto, Osaka, Hyogo, Nara, Wakayama]
  Chugoku: [Tottori, Shimane, Okayama, Hiroshima, Yamaguchi]
  Shikoku: [Tokushima, Kagawa, Ehime, Kochi]
  Kyushu: [Fukuoka, Saga, Nagasaki, Kumamoto, Oita, Miyazaki, Kagoshima, Okinawa]
