version: 0.0.1

methodology: network_validation   # technique used in the validation:
                                  # - network_validation: to validate a single network file specified in    "network_validation" block

datasets:
  demand: ["ourworldindata"]  # list of datasets sources to use. A subset of 'ourworldindata', 'ember'
  installed_capacity: ["irena"]  # list of datasets sources to use. A subset of 'irena', 'ember'
  electricity_generation: ["ember"]  # list of datasets sources to use. A subset of 'ember', 'irena'
  # energy_dispatch: []  # list of datasets sources to validate energy dispatch. Not yet supported
  # network: []  # list of datasets sources to validate networks. Not yet supported

network_validation:
  name: "validation_name" # Unique identifier for the validation run. Change it to keep outputs from different validation configurations separate.
  network_path: "../../results/US_2023/postnetworks/elec_s_100_ec_lv1_Co2L-168h_168h_2020_0.07.nc" # File to the PyPSA network file to validate
  year: [2023]  # year of the network to validate
  countries: ['US']  # country of the network to validate
  shapefile: false
  validate_cross_border_capacity: true # validation of cross border capacity
  fallback_pypsa_earth_version: ""  # recorded when the network carries no version metadata; leave empty rather than asserting a version that may be wrong

  # Validation of multiple networks against the same datasets.
  # The networks are specified in the "networks" block, where each network has a unique name
  # and specifies the path to the network file and the countries it covers.
  # The validation will be performed for each network in the list.
  # Uncomment the "networks" block and add the networks you want to validate.
  #
  # networks:
  #   NG_2021:
  #     path: "results/NG_2021/networks/elec_s_40flex_ec_lc1.0_1H.nc"
  #     countries: ["NG"]
  #   ZA_2021:
  #     path: "results/ZA_2021/networks/elec_s_40flex_ec_lc1.0_1H.nc"
  #     countries: ["ZA"]
  #   US_2021:
  #     path: "results/US_2021/networks/elec_s_60flex_ec_lc1.0_1H.nc"
  #     countries: ["US"]
  #   SAPP:
  #     path: "results/SAPP/networks/elec_s_40flex_ec_lc1.0_1H.nc"
  #     countries: ["ZA", "BW", "LS", "MW", "MZ"]


sector_emissions:  # used by the plot_sector_emissions rule (sector-coupled networks only)
  reference_source: "edgar"  # "edgar" (downloaded automatically), "csv" (a local file, e.g. an IEA download) or "none" (model only)
  reference_year: null  # year to compare against; defaults to the first entry of network_validation.year
  edgar:
    label: "EDGAR"
    # EDGAR GHG booklet, fossil CO2 only, MtCO2/yr per country and sector. CC BY 4.0, https://edgar.jrc.ec.europa.eu/report_2025
    url: "https://edgar.jrc.ec.europa.eu/booklet/EDGAR_2025_GHG_booklet_2025_fossilCO2only.xlsx"
    sheet: "fossil_CO2_by_sector_country_su"
    sector_map:  # EDGAR sector -> model sector
      "Power Industry": "power_and_heat_generation"
      "Transport": "transport"
      "Industrial Combustion": "industry"
      "Processes": "industry_process_emissions"
      "Buildings": "buildings"
      "Agriculture": "agriculture"
      "Fuel Exploitation": "fuel_exploitation"
      "Waste": "waste"
    model_sector_groups:  # EDGAR reports residential and services together as buildings
      "residential": "buildings"
      "services": "buildings"
  csv:
    label: "IEA"
    path: ""  # CSV with columns: <sector label>, Value [MtCO2], Year, Units (IEA data explorer download format)
    sector_map:  # reference sector label -> model sector
      "Electricity and heat producers": "power_and_heat_generation"
      "Transport Sector": "transport"
      "Industry Sector": "industry"
      "Residential": "residential"
      "Commercial and Public Services": "services"
      "Agriculture/Forestry": "agriculture"
    model_sector_groups: {}
  fuels: ["coal", "oil", "gas"]  # bus carriers to report fuel withdrawals for


plot_osm_grid_network:
  grid_path: "tests/fixtures"
  line_voltages: [132., 220., 300., 380., 500., 750.]
  voltage_colors: ["#deb887", "#ff7f50", "#cd5c5c", "#9400D3", "#00ced1", "#ffffff"]  # colors for each voltage level in line_voltages
  plot_circuits: false  # whether to plot the number of circuits on the lines if available
